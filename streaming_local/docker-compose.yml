# Local learning mode: EventStreams -> Kafka -> Spark Structured Streaming -> Delta Lake.
#   docker compose -f streaming_local/docker-compose.yml up
# Delta tables appear in streaming_local/data/. Spark UI: http://localhost:4040

name: wikipulse-streaming

services:
  kafka:
    image: apache/kafka:3.8.0
    ports:
      - "29092:29092"          # for clients on your machine (localhost:29092)
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: PLAINTEXT://0.0.0.0:9092,CONTROLLER://0.0.0.0:9093,PLAINTEXT_HOST://0.0.0.0:29092
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092,PLAINTEXT_HOST://localhost:29092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-broker-api-versions.sh --bootstrap-server localhost:9092 > /dev/null 2>&1"]
      interval: 10s
      timeout: 10s
      retries: 12
      start_period: 15s

  kafka-init:
    image: apache/kafka:3.8.0
    depends_on:
      kafka:
        condition: service_healthy
    entrypoint:
      - /opt/kafka/bin/kafka-topics.sh
      - --bootstrap-server=kafka:9092
      - --create
      - --if-not-exists
      - --topic=wiki_recentchange
      - --partitions=3
      - --replication-factor=1
      - --config=retention.ms=21600000   # keep 6 hours; bronze is the permanent copy
    restart: "no"

  producer:
    image: python:3.12-slim
    depends_on:
      kafka-init:
        condition: service_completed_successfully
    working_dir: /app
    volumes:
      - ..:/app:ro
    environment:
      KAFKA_BOOTSTRAP: kafka:9092
      LOOKBACK_MINUTES: "30"
      PYTHONUNBUFFERED: "1"
    command: sh -c "pip install -q --root-user-action=ignore requests confluent-kafka && python -m streaming_local.producer"
    restart: unless-stopped

  spark:
    image: apache/spark:3.5.3-scala2.12-java17-python3-ubuntu
    user: root
    depends_on:
      kafka-init:
        condition: service_completed_successfully
    working_dir: /app
    volumes:
      - ..:/app:ro
      - ./data:/data
      - ivy-cache:/root/.ivy2
    environment:
      PYTHONPATH: /app
      KAFKA_BOOTSTRAP: kafka:9092
      LAKE_DIR: /data
    ports:
      - "4040:4040"
    command:
      - /opt/spark/bin/spark-submit
      - --master=local[2]
      - --driver-memory=1g
      - --packages=org.apache.spark:spark-sql-kafka-0-10_2.12:3.5.3,io.delta:delta-spark_2.12:3.2.1
      - --conf=spark.jars.ivy=/root/.ivy2
      - --conf=spark.sql.extensions=io.delta.sql.DeltaSparkSessionExtension
      - --conf=spark.sql.catalog.spark_catalog=org.apache.spark.sql.delta.catalog.DeltaCatalog
      - /app/streaming_local/jobs/run_all.py
    restart: unless-stopped

volumes:
  ivy-cache:
