name: Daily batch

on:
  schedule:
    # Pageview rankings for the previous day are published a few hours after midnight UTC.
    - cron: "0 6 * * *"
  workflow_dispatch:
    inputs:
      day:
        description: "Day to process (YYYY-MM-DD). Defaults to yesterday (UTC)."
        required: false

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - run: pip install -r requirements.txt

      - name: Top-read, digest, summaries, retention
        run: python -m pipeline.run_daily ${{ inputs.day }}
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          LAKE_BUCKET: lake
